name: 🖼️ 测试图片生成脚本 (macOS)

# 触发条件：推送代码到 main 分支 或 手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许在 GitHub 网页上手动运行

jobs:
  test-on-macos:
    # 使用最新的 macOS 运行器
    runs-on: macos-latest
    
    # 设置超时时间，防止脚本卡死
    timeout-minutes: 5

    steps:
      # ============================================
      # 步骤 1: 检出代码
      # ============================================
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ============================================
      # 步骤 2: 显示 macOS 环境信息
      # ============================================
      - name: 🖥️ 显示 macOS 环境信息
        run: |
          echo "=== macOS 版本 ==="
          sw_vers
          echo ""
          echo "=== Shell 版本 ==="
          bash --version | head -1
          echo ""
          echo "=== Python 版本 ==="
          python3 --version || echo "Python3 未安装"
          echo ""
          echo "=== 当前目录 ==="
          pwd
          ls -la

      # ============================================
      # 步骤 3: 创建测试图片（模拟 ui 文件夹）
      # ============================================
      - name: 📁 创建测试图片
        run: |
          # 如果 ui 文件夹不存在，创建它
          mkdir -p ui
          
          # 创建 5 张测试图片（不同格式）
          echo "创建测试图片..."
          
          # PNG 测试图
          echo "fake png content" > ui/photo1.png
          echo "fake png content" > ui/photo2.png
          
          # JPG 测试图
          echo "fake jpg content" > ui/image1.jpg
          echo "fake jpg content" > ui/image2.jpg
          
          # GIF 测试图
          echo "fake gif content" > ui/animation.gif
          
          # 显示创建的文件
          echo ""
          echo "=== ui 文件夹内容 ==="
          ls -la ui/

      # ============================================
      # 步骤 4: 设置脚本执行权限
      # ============================================
      - name: 🔧 设置脚本执行权限
        run: |
          chmod +x generate_ui.sh
          echo "✅ 脚本权限已设置"
          ls -la generate_ui.sh

      # ============================================
      # 步骤 5: 检查脚本语法（不执行）
      # ============================================
      - name: 📝 检查脚本语法
        run: |
          echo "=== 语法检查 ==="
          if bash -n generate_ui.sh 2>&1; then
            echo "✅ 语法正确"
          else
            echo "❌ 语法错误"
            exit 1
          fi

      # ============================================
      # 步骤 6: 检查脚本中的 macOS 兼容性问题
      # ============================================
      - name: 🔍 检查 macOS 兼容性
        run: |
          echo "=== macOS 兼容性检查 ==="
          
          # 检查 sed -i 参数（macOS 需要 -i ''）
          if grep -q "sed -i [^']" generate_ui.sh; then
            echo "⚠️  发现 sed -i 可能缺少备份参数（macOS 需要 -i ''）"
          else
            echo "✅ sed 使用正确"
          fi
          
          # 检查是否使用 realpath（macOS 没有）
          if grep -q "realpath" generate_ui.sh; then
            echo "⚠️  发现 realpath 命令（macOS 可能不支持）"
          else
            echo "✅ 未使用 realpath"
          fi
          
          # 检查 shebang
          if head -1 generate_ui.sh | grep -q "#!/bin/bash"; then
            echo "✅ Shebang 正确"
          else
            echo "❌ Shebang 应该是 #!/bin/bash"
            exit 1
          fi

      # ============================================
      # 步骤 7: 运行脚本生成 ui.html
      # ============================================
      - name: 🚀 运行生成脚本
        run: |
          echo "=== 运行脚本 ==="
          ./generate_ui.sh
          
          # 显示生成结果
          echo ""
          echo "=== 生成结果 ==="
          ls -la ui.html

      # ============================================
      # 步骤 8: 验证生成结果
      # ============================================
      - name: ✅ 验证生成结果
        run: |
          echo "=== 验证 ui.html ==="
          
          # 检查文件是否存在
          if [ ! -f "ui.html" ]; then
            echo "❌ ui.html 未生成"
            exit 1
          fi
          echo "✅ ui.html 已生成"
          
          # 检查文件大小（至少包含一些内容）
          FILE_SIZE=$(stat -f%z ui.html 2>/dev/null || stat -c%s ui.html 2>/dev/null)
          if [ "$FILE_SIZE" -gt 100 ]; then
            echo "✅ ui.html 文件大小正常: $FILE_SIZE 字节"
          else
            echo "❌ ui.html 文件大小异常: $FILE_SIZE 字节"
            exit 1
          fi
          
          # 检查是否包含关键的 HTML 结构
          if grep -q "slider-wrapper" ui.html; then
            echo "✅ 包含 slider-wrapper（滑动容器）"
          else
            echo "❌ 缺少 slider-wrapper"
            exit 1
          fi
          
          if grep -q "slide" ui.html; then
            echo "✅ 包含 slide（图片项）"
          else
            echo "❌ 缺少 slide"
            exit 1
          fi
          
          # 统计图片数量
          IMAGE_COUNT=$(grep -c '<div class="slide"' ui.html || echo "0")
          echo "📊 生成的图片数量: $IMAGE_COUNT 张"
          
          if [ "$IMAGE_COUNT" -eq 5 ]; then
            echo "✅ 图片数量正确（5 张）"
          else
            echo "⚠️  图片数量与预期不符（期望 5 张，实际 $IMAGE_COUNT 张）"
          fi

      # ============================================
      # 步骤 9: 显示生成的 HTML 预览（前几行）
      # ============================================
      - name: 📄 显示 HTML 预览
        run: |
          echo "=== ui.html 预览（前 30 行）==="
          head -30 ui.html
          echo ""
          echo "..."
          echo ""
          echo "=== 图片部分预览 ==="
          grep -A 2 '<div class="slide"' ui.html | head -15 || echo "未找到 slide"

      # ============================================
      # 步骤 10: 上传生成的文件（方便下载查看）
      # ============================================
      - name: 📤 上传生成的文件
        uses: actions/upload-artifact@v4
        with:
          name: generated-ui-html
          path: |
            ui.html
            ui/
          retention-days: 7

      # ============================================
      # 完成
      # ============================================
      - name: 🎉 测试完成
        run: |
          echo "===================================="
          echo "   ✅ 所有测试通过！"
          echo "===================================="
          echo ""
          echo "📊 测试摘要:"
          echo "   • 脚本语法: ✅"
          echo "   • macOS 兼容性: ✅"
          echo "   • ui.html 生成: ✅"
          echo "   • 图片数量: $(grep -c '<div class="slide"' ui.html) 张"
          echo ""
          echo "📥 下载生成的文件:"
          echo "   在 Actions 页面 -> Artifacts -> generated-ui-html"
